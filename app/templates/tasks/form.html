{% extends "base.html" %}
{% block title %}{{ 'Edit task' if task else 'Add task' }} | CloudTask{% endblock %}
{% block content %}
<section class="form-panel"><a class="back" href="{{ url_for('tasks.index') }}">← Back to tasks</a><p class="eyebrow">{{ 'Refine task' if task else 'New task' }}</p><h1>{{ 'Edit task' if task else 'Add a task' }}</h1><form method="post" class="stack"><label>Title<input type="text" name="title" maxlength="200" required value="{{ task.title if task else '' }}"></label><label>Description<textarea name="description" rows="5" placeholder="What does done look like?">{{ task.description if task else '' }}</textarea></label><label>Priority<select name="priority"><option value="low" {{ 'selected' if task and task.priority == 'low' else '' }}>Low</option><option value="medium" {{ 'selected' if not task or task.priority == 'medium' else '' }}>Medium</option><option value="high" {{ 'selected' if task and task.priority == 'high' else '' }}>High</option></select></label><label>Category<input list="category-options" type="text" name="category" maxlength="80" value="{{ task.category if task else 'Other' }}"><datalist id="category-options"><option value="Assignment"><option value="Exam"><option value="Project"><option value="Other"></datalist></label><label>Due date<input type="date" name="due_date" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}"></label><button class="primary" type="submit">{{ 'Save changes' if task else 'Add task' }}</button></form></section>
{% endblock %}
