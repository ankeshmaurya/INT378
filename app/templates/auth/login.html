{% extends "base.html" %}
{% block title %}Sign in | CloudTask{% endblock %}
{% block content %}
<section class="auth-panel"><p class="eyebrow">Student task operations</p><h1>Keep your next move visible.</h1><p class="muted">A calm place for the tasks that keep your cloud work moving.</p>
<form method="post" class="stack"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button></form>
<p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>
{% endblock %}
